name: Unpack and build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Unpack the zip into the repository
        run: |
          if ls *.zip >/dev/null 2>&1; then
            z=$(ls *.zip | head -1)
            mkdir -p tmp
            unzip -q "$z" -d tmp
            dir=$(dirname "$(find tmp -maxdepth 3 -name settings.gradle | head -1)")
            cp -r "$dir"/. .
            rm -rf tmp "$z"
            gradle wrapper --gradle-version 8.2
            git config user.name "Collo-hue"
            git config user.email "Collo-hue@users.noreply.github.com"
            git add -A
            git commit -m "Add Simple Calculator project files"
            git push
          fi
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
